name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checkout@v6 and upload-artifact@v7 ship Node 24 natively. setup-zig@v2
# still ships Node 20, so keep the runner-level Node 24 opt-in until mlugg
# cuts a Node 24 release; drop this once it does.
env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Pull-request builds skip the LFS-backed resource pack.
  dev:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-linux-gnu,   name: linux,      kind: game,   extra: "-Dcpu=x86_64_v3 -Duse-cwd=true" }
          - { os: ubuntu-latest,  target: x86_64-linux-gnu,   name: linux_gl,   kind: game,   extra: "-Dcpu=x86_64_v3 -Dgfx=opengl -Duse-cwd=true" }
          - { os: ubuntu-latest,  target: x86_64-linux-gnu,   name: linux,      kind: server, extra: -Dcpu=x86_64_v3 }
          - { os: macos-14,                                   name: mac,        kind: game }
          - { os: macos-14,                                   name: mac,        kind: server }
          - { os: ubuntu-latest,  target: x86_64-windows-gnu, name: windows,         kind: game,   extra: "-Dcpu=x86_64_v3 -Dgfx=opengl -Duse-cwd=true" }
          - { os: ubuntu-latest,  target: x86_64-windows-gnu, name: windows_vulkan,  kind: game,   extra: "-Dcpu=x86_64_v3 -Dgfx=vulkan -Duse-cwd=true" }
          - { os: ubuntu-latest,  target: x86_64-windows-gnu, name: windows,         kind: server, extra: -Dcpu=x86_64_v3 }
          - { os: ubuntu-latest,  target: mipsel-psp,         name: psp,        kind: game,   extra: "" }
          - { os: ubuntu-latest,  target: arm-3ds,            name: 3ds,        kind: game,   extra: "" }
    runs-on: ${{ matrix.os }}
    name: dev ${{ matrix.kind }} (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      # macOS game: SDL3 is vendored and statically linked; the only system
      # dependency is MoltenVK, which Aether.exportArtifact bundles into the
      # .app. Other targets vendor everything.
      - name: Install macOS dependencies
        if: matrix.name == 'mac' && matrix.kind == 'game'
        run: brew install molten-vk

      - name: Build
        if: matrix.name != 'mac'
        run: zig build ${{ matrix.kind }} -Dtarget=${{ matrix.target }} -Doptimize=${{ (startsWith(matrix.name, 'windows') || matrix.name == '3ds') && 'ReleaseFast' || 'ReleaseSafe' }} ${{ matrix.extra }} -Dskip-pack=true

      # macOS builds natively. SDL's build demands --sysroot for any explicit
      # (non-native) -Dtarget, and --sysroot in turn breaks the absolute
      # Homebrew / vendored system_sdk paths Aether links against. The runner
      # is already Apple Silicon, so a native build IS the aarch64-macos
      # artifact.
      - name: Build (macOS)
        if: matrix.name == 'mac'
        run: zig build ${{ matrix.kind }} -Doptimize=ReleaseSafe -Dskip-pack=true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.kind }}_${{ matrix.name }}
          # Windows PDBs are debugger symbols, not part of the distributable.
          path: |
            zig-out/bin/
            !zig-out/bin/**/*.pdb
          if-no-files-found: error

  # Switch packaging needs devkitA64 and libnx, which the dedicated
  # devkitPro image provides under /opt/devkitpro. Keep this separate from
  # the platform matrix: GitHub job containers cannot be used for macOS.
  switch-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: dev game (switch)
    container:
      # devkitpro/devkita64:20260219 (linux/amd64), pinned by digest so
      # toolchain updates are deliberate workflow changes.
      image: devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
    steps:
      # Do not fetch LFS: this compile-only check deliberately skips pack.zip.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Build Nintendo Switch game
        run: zig build game -Dtarget=aarch64-freestanding -Dnintendo-switch -Doptimize=ReleaseSafe -Dskip-pack=true

      - name: Verify Nintendo Switch artifact
        shell: sh
        run: |
          nro="zig-out/bin/CrossCraft-Classic-Switch/CrossCraft-Classic.nro"
          elf="zig-out/bin/CrossCraft-Classic-Switch/CrossCraft-Classic.elf"
          test -s "$nro" || { echo "missing or empty $nro"; exit 1; }
          test -s "$elf" || { echo "missing or empty $elf"; exit 1; }
          echo "Switch game OK (.nro + .elf)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-game_switch
          path: zig-out/bin/CrossCraft-Classic-Switch/
          if-no-files-found: error

  # Full release-style builds on push to main / v* tags. Pulls LFS for game
  # builds so pack.zip ships with real resources, runs per-platform artifact
  # verification, and uploads each (kind, target) as a separate workflow
  # artifact for download.
  rel:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-linux-gnu,   name: linux,      kind: game,   extra: -Dcpu=x86_64_v3 }
          - { os: ubuntu-latest,  target: x86_64-linux-gnu,   name: linux_gl,   kind: game,   extra: "-Dcpu=x86_64_v3 -Dgfx=opengl" }
          - { os: ubuntu-latest,  target: x86_64-linux-gnu,   name: linux,      kind: server, extra: -Dcpu=x86_64_v3 }
          - { os: macos-latest,   name: mac,        kind: game }
          - { os: macos-latest,   name: mac,        kind: server }
          - { os: ubuntu-latest,  target: x86_64-windows-gnu, name: windows,         kind: game,   extra: "-Dcpu=x86_64_v3 -Dgfx=opengl" }
          - { os: ubuntu-latest,  target: x86_64-windows-gnu, name: windows_vulkan,  kind: game,   extra: "-Dcpu=x86_64_v3 -Dgfx=vulkan" }
          - { os: ubuntu-latest,  target: x86_64-windows-gnu, name: windows,         kind: server, extra: -Dcpu=x86_64_v3 }
          - { os: ubuntu-latest,  target: mipsel-psp,         name: psp,        kind: game,   extra: "" }
          - { os: ubuntu-latest,  target: arm-3ds,            name: 3ds,        kind: game,   extra: "" }
    runs-on: ${{ matrix.os }}
    name: rel ${{ matrix.kind }} (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          # Game builds need real resources to produce a valid pack.zip;
          # server builds never touch the resources submodule, so skip LFS.
          lfs: ${{ matrix.kind == 'game' }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Install macOS dependencies
        if: matrix.name == 'mac' && matrix.kind == 'game'
        run: brew install molten-vk

      # Server never packs resources and only ships for PC targets.
      - name: Build server
        if: matrix.kind == 'server' && matrix.name != 'mac'
        run: zig build server -Dtarget=${{ matrix.target }} -Doptimize=${{ startsWith(matrix.name, 'windows') && 'ReleaseFast' || 'ReleaseSafe' }} ${{ matrix.extra }} -Dskip-pack=true

      # macOS (game + server) builds natively: SDL's build requires --sysroot
      # for any explicit (non-native) -Dtarget, and --sysroot breaks the
      # absolute Homebrew / vendored system_sdk paths Aether links. The runner
      # is Apple Silicon, so native == aarch64-macos.
      - name: Build server (macOS)
        if: matrix.kind == 'server' && matrix.name == 'mac'
        run: zig build server -Doptimize=ReleaseSafe -Dskip-pack=true

      # Desktop game (linux/windows): -Duse-cwd=true so pack.zip ships as a
      # loose file in zig-out/bin/ next to the binary.
      - name: Build game (desktop)
        if: matrix.kind == 'game' && (startsWith(matrix.name, 'linux') || startsWith(matrix.name, 'windows'))
        run: zig build game -Dtarget=${{ matrix.target }} -Doptimize=${{ startsWith(matrix.name, 'windows') && 'ReleaseFast' || 'ReleaseSafe' }} ${{ matrix.extra }} -Duse-cwd=true

      # macOS game: Aether.exportArtifact routes pack.zip into
      # CrossCraft-Classic.app/Contents/Resources/pack.zip — no -Duse-cwd.
      # Built natively (see "Build server (macOS)" above).
      - name: Build game (macOS)
        if: matrix.kind == 'game' && matrix.name == 'mac'
        run: zig build game -Doptimize=ReleaseSafe

      # PSP game: build.zig installs pack.zip into the PSP
      # bundle dir alongside EBOOT.PBP / app.prx.
      - name: Build game (PSP)
        if: matrix.kind == 'game' && matrix.name == 'psp'
        run: zig build game -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe ${{ matrix.extra }}

      # 3DS game: build.zig installs pack.zip beside the .3dsx artifact.
      - name: Build game (3DS)
        if: matrix.kind == 'game' && matrix.name == '3ds'
        run: zig build game -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast ${{ matrix.extra }}

      # Ship the archival world with every release artifact. macOS game
      # bundles receive it from build.zig before signing; console builds and
      # CWD-based desktop/server artifacts are copied here.
      - name: Bundle archival saves
        shell: bash
        run: |
          case "${{ matrix.kind }}_${{ matrix.name }}" in
            game_psp) bundle="zig-out/bin/CrossCraft-Classic-PSP" ;;
            game_3ds) bundle="zig-out/bin/CrossCraft-Classic-3DS" ;;
            game_mac) bundle="zig-out/bin/CrossCraft-Classic.app/Contents/Resources" ;;
            *) bundle="zig-out/bin" ;;
          esac
          test -d "$bundle" || { echo "missing release bundle $bundle"; exit 1; }
          if [[ "${{ matrix.kind }}_${{ matrix.name }}" != "game_mac" ]]; then
            cp -R saves "$bundle/"
          fi
          test -s "$bundle/saves/origins.cw" || { echo "missing bundled saves/origins.cw"; exit 1; }

      # pack.zip size check guards against LFS regressions on every game
      # platform: a pointer stub is ~130 B, a real pack is multi-MB.
      - name: Verify desktop game artifact
        if: matrix.kind == 'game' && (startsWith(matrix.name, 'linux') || startsWith(matrix.name, 'windows'))
        shell: bash
        run: |
          pack="zig-out/bin/pack.zip"
          test -f "$pack" || { echo "missing $pack"; exit 1; }
          size=$(wc -c <"$pack")
          test "$size" -gt 1000000 || { echo "pack.zip only $size bytes (LFS stubs?)"; exit 1; }
          echo "pack.zip OK ($size bytes)"

      - name: Verify macOS bundle
        if: matrix.kind == 'game' && matrix.name == 'mac'
        run: |
          otool -L zig-out/bin/CrossCraft-Classic.app/Contents/MacOS/CrossCraft-Classic
          otool -l zig-out/bin/CrossCraft-Classic.app/Contents/MacOS/CrossCraft-Classic | grep -A2 LC_RPATH
          codesign --verify --verbose zig-out/bin/CrossCraft-Classic.app
          pack="zig-out/bin/CrossCraft-Classic.app/Contents/Resources/pack.zip"
          test -f "$pack" || { echo "missing $pack"; exit 1; }
          size=$(stat -f%z "$pack")
          test "$size" -gt 1000000 || { echo "pack.zip only $size bytes (LFS stubs?)"; exit 1; }
          echo "pack.zip OK ($size bytes)"
          save="zig-out/bin/CrossCraft-Classic.app/Contents/Resources/saves/origins.cw"
          test -s "$save" || { echo "missing bundled $save"; exit 1; }
          echo "archival save OK ($save)"

      # ditto preserves .app metadata / symlinks better than zip;
      # actions/upload-artifact otherwise re-zips and can mangle bundles.
      - name: Package macOS .app
        if: matrix.kind == 'game' && matrix.name == 'mac'
        run: ditto -c -k --keepParent zig-out/bin/CrossCraft-Classic.app CrossCraft-Classic-macos.zip

      - name: Verify PSP game artifact
        if: matrix.kind == 'game' && matrix.name == 'psp'
        run: |
          eboot="zig-out/bin/CrossCraft-Classic-PSP/EBOOT.PBP"
          pack="zig-out/bin/CrossCraft-Classic-PSP/pack.zip"
          test -s "$eboot" || { echo "missing or empty $eboot"; exit 1; }
          test -f "$pack" || { echo "missing $pack"; exit 1; }
          size=$(wc -c <"$pack")
          test "$size" -gt 1000000 || { echo "pack.zip only $size bytes (LFS stubs?)"; exit 1; }
          echo "PSP game OK (EBOOT.PBP + pack.zip $size bytes)"

      - name: Verify 3DS game artifact
        if: matrix.kind == 'game' && matrix.name == '3ds'
        run: |
          threedsx="zig-out/bin/CrossCraft-Classic-3DS/CrossCraft-Classic.3dsx"
          pack="zig-out/bin/CrossCraft-Classic-3DS/pack.zip"
          test -s "$threedsx" || { echo "missing or empty $threedsx"; exit 1; }
          test -f "$pack" || { echo "missing $pack"; exit 1; }
          size=$(wc -c <"$pack")
          test "$size" -gt 1000000 || { echo "pack.zip only $size bytes (LFS stubs?)"; exit 1; }
          echo "3DS game OK (.3dsx + pack.zip $size bytes)"

      - name: Upload macOS .app
        if: matrix.kind == 'game' && matrix.name == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: game_mac
          path: CrossCraft-Classic-macos.zip
          if-no-files-found: error

      - name: Upload artifact
        if: matrix.kind != 'game' || matrix.name != 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kind }}_${{ matrix.name }}
          # Windows PDBs are debugger symbols, not part of the distributable.
          path: |
            zig-out/bin/
            !zig-out/bin/**/*.pdb
          if-no-files-found: error

  # Release-style Switch build.  This is separate from rel because devkitA64
  # and libnx live in the job container rather than on GitHub's runner image.
  switch-rel:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: rel game (switch)
    container:
      # devkitpro/devkita64:20260219 (linux/amd64), pinned by digest so
      # toolchain updates are deliberate workflow changes.
      image: devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
    steps:
      # The devkitPro image provides Git but not Git LFS. Install it before
      # checkout so actions/checkout can hydrate the resource submodule.
      - name: Install Git LFS
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y git-lfs

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: true

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Build Nintendo Switch game
        run: zig build game -Dtarget=aarch64-freestanding -Dnintendo-switch -Doptimize=ReleaseSafe

      - name: Bundle archival saves
        shell: sh
        run: |
          bundle="zig-out/bin/CrossCraft-Classic-Switch"
          test -d "$bundle" || { echo "missing release bundle $bundle"; exit 1; }
          cp -R saves "$bundle/"
          test -s "$bundle/saves/origins.cw" || { echo "missing bundled saves/origins.cw"; exit 1; }

      # Guard against an LFS pointer being packaged instead of the resource
      # pack, just as the other console release jobs do.
      - name: Verify Nintendo Switch artifact
        shell: sh
        run: |
          nro="zig-out/bin/CrossCraft-Classic-Switch/CrossCraft-Classic.nro"
          elf="zig-out/bin/CrossCraft-Classic-Switch/CrossCraft-Classic.elf"
          pack="zig-out/bin/CrossCraft-Classic-Switch/pack.zip"
          test -s "$nro" || { echo "missing or empty $nro"; exit 1; }
          test -s "$elf" || { echo "missing or empty $elf"; exit 1; }
          test -f "$pack" || { echo "missing $pack"; exit 1; }
          size=$(wc -c <"$pack")
          test "$size" -gt 1000000 || { echo "pack.zip only $size bytes (LFS stubs?)"; exit 1; }
          echo "Switch game OK (.nro + .elf + pack.zip $size bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: game_switch
          path: zig-out/bin/CrossCraft-Classic-Switch/
          if-no-files-found: error

  # Host tests need no LFS resources. The golden corpus checks worldgen
  # byte parity with the reference generator.
  tests:
    runs-on: ubuntu-latest
    name: unit and worldgen tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Unit tests
        run: zig build test -Dskip-pack=true

      - name: Worldgen golden hashes (100 worlds)
        run: zig build worldgen-test -Doptimize=ReleaseSafe -Dskip-pack=true
